name: Release

# Repositório sem imagem: a tag só produz a GitHub Release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  release:
    uses: navyr-io/.github/.github/workflows/release.yml@main
    permissions:
      contents: write
